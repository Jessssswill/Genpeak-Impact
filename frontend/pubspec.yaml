name: frontend
description: "GenPeak Impact - Genshin Import Marketplace"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/elements/
    - assets/images/currency/
    - assets/images/avatars/
